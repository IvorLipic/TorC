# Deploys the prebuilt static site in site/ to GitHub Pages (https://<user>.github.io/TorC/).
# Deploys on push to `web` (when the site or this workflow changes) or manually; never from any other branch.
# There is no build step: site/ is checked (tools/check_site.mjs, Node tests) and uploaded as it is.
name: Deploy site

on:
  push:
    branches: [web]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The single branch this workflow may deploy from. Change deliberately when the site branch is chosen.
  ALLOWED_BRANCH: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to run from any other branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${ALLOWED_BRANCH}" ]; then
            echo "Deployment is only allowed from ${ALLOWED_BRANCH}, got ${GITHUB_REF_NAME}"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site check (course.json, lesson shells, modules, trace files, relative URLs, assets)
        run: node tools/check_site.mjs
      - name: Engine, explanations, lessons and site tooling match the real TorC run
        run: node --test site/test/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
