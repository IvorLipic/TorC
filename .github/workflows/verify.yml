# Checks the static site (check_site + Node tests), that the committed trace JSON equals a fresh run of the pinned TorC, and that
# the code shown on the home page compiles and runs against it.
name: Verify

on:
  push:
    branches: [web]
    paths: ["site/**", "tools/**", ".claude/skills/**", ".github/workflows/verify.yml"]
  pull_request:
    paths: ["site/**", "tools/**", ".claude/skills/**", ".github/workflows/verify.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site check (course.json, lesson shells, modules, trace files, relative URLs, assets)
        run: node tools/check_site.mjs
      - name: Writing rules (ASD-STE100 linter on the visible prose of every page)
        run: tools/prose/check.sh
      - name: Toolchain (clang 18 + CMake)
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake
      - name: MNIST files for the MNIST trace (the four IDX archives; run.sh checks their SHA-256 and converts them)
        uses: actions/cache@v4
        with:
          path: build/mnist/*.gz
          key: mnist-idx-${{ hashFiles('tools/trace/fetch_mnist.sh') }}
      - name: Trace drift check against the pinned TorC
        run: CXX=clang++-18 tools/trace/run.sh --check
      - name: Site tests (engine vs. real library output, LaTeX validity, registry, lessons, store, site tooling; after the trace step so the quoted library lines are compared with the fetched TorC source)
        run: TORC_REQUIRE_SOURCE=1 node --test site/test/*.test.mjs
      - name: Home-page code compiles and runs against the pinned TorC (uses the source the trace step fetched)
        run: node tools/snippets/check.mjs --cxx clang++-18
